openapi: 3.0.3
info:
  title: Student Exam & Course Tracker API
  version: 0.4.0
  description: REST API used by the React frontend. All endpoints except health, register and login need a Bearer token.
servers:
  - url: http://localhost:4000/api
    description: Local development

tags:
  - name: Health
  - name: Auth
  - name: Courses
  - name: Exams
  - name: Grades
  - name: Dashboard

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check used after deployment
      security: []
      responses:
        '200':
          description: API is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }

  /auth/register:
    post:
      tags: [Auth]
      summary: Create an account (FR1)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterInput' }
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409':
          description: E-mail already registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in and receive a JWT (FR1)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginInput' }
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401':
          description: Wrong e-mail or password
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/me:
    get:
      tags: [Auth]
      summary: Current user
      responses:
        '200':
          description: The logged in user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /courses:
    get:
      tags: [Courses]
      summary: List my courses (FR2, FR7)
      responses:
        '200':
          description: Courses of the logged in user
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Course' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Courses]
      summary: Add a course (FR2)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CourseInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Course' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /courses/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Courses]
      summary: Get one of my courses
      responses:
        '200':
          description: The course
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Course' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Courses]
      summary: Update a course
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CourseInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Course' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Courses]
      summary: Delete a course and its exams
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /courses/{id}/exams:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Exams]
      summary: List exams of a course, sorted by date (FR3)
      responses:
        '200':
          description: Exams
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Exam' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Exams]
      summary: Add an exam or assignment (FR3)
      description: >
        The weights of all exams of one course cannot add up to more than 100%.
        If they would, the API returns 400 and details.weight says how much is left.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExamInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Exam' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /courses/{id}/grade:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Grades]
      summary: Weighted average and letter grade of one course (FR5)
      responses:
        '200':
          description: Grade of the course
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CourseGrade' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /exams:
    get:
      tags: [Exams]
      summary: Search and filter all exams of the user (FR6)
      description: >
        All filters are optional and can be combined. Empty values mean "no filter".
        The result is sorted by date and every item includes its course.
      parameters:
        - name: q
          in: query
          description: Text in the exam title or the course code or name (not case sensitive).
          schema: { type: string, maxLength: 100 }
        - name: courseId
          in: query
          schema: { type: integer, minimum: 1 }
        - name: type
          in: query
          schema: { type: string, enum: [exam, quiz, assignment, project] }
        - name: from
          in: query
          description: First date (inclusive).
          schema: { type: string, format: date, example: '2026-11-01' }
        - name: to
          in: query
          description: Last date (inclusive, a plain date includes the whole day).
          schema: { type: string, format: date, example: '2026-11-30' }
      responses:
        '200':
          description: Matching exams, can be empty
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ExamWithCourse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /exams/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Exams]
      summary: Get one exam (FR3)
      responses:
        '200':
          description: Exam
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Exam' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Exams]
      summary: Update an exam (FR3)
      description: The old weight of this exam is not counted in the 100% check.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExamInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Exam' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Exams]
      summary: Delete an exam (FR3)
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /grades:
    get:
      tags: [Grades]
      summary: Averages of all courses and the estimated GPA (FR5)
      description: >
        The course average is the weighted average of the graded exams.
        Letters: AA 90+, BA 85-89, BB 80-84, CB 75-79, CC 70-74, DC 60-69,
        DD 50-59, FF below 50. The GPA uses a 4.0 scale (AA 4.0, BA 3.5, BB 3.0,
        CB 2.5, CC 2.0, DC 1.5, DD 1.0, FF 0) and is weighted by credits.
        Courses without grades are not counted.
      responses:
        '200':
          description: Grades
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GradesSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /deadlines:
    get:
      tags: [Dashboard]
      summary: Upcoming and overdue exams and assignments (FR4)
      description: >
        Upcoming = from today until today + days. Overdue = the date has passed
        and there is no grade yet. Days are counted in UTC.
      parameters:
        - name: days
          in: query
          schema: { type: integer, minimum: 1, maximum: 365, default: 14 }
      responses:
        '200':
          description: Deadlines
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Deadlines' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer }

  responses:
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Not found or owned by another user
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Invalid input
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
        details:
          type: object
          additionalProperties:
            type: array
            items: { type: string }

    User:
      type: object
      properties:
        id: { type: integer }
        email: { type: string, format: email }
        name: { type: string }

    RegisterInput:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }

    AuthResponse:
      type: object
      properties:
        token: { type: string }
        user: { $ref: '#/components/schemas/User' }

    CourseInput:
      type: object
      required: [name, code, credits, term]
      properties:
        name: { type: string, minLength: 1, maxLength: 100, example: Software Testing }
        code: { type: string, minLength: 1, maxLength: 20, example: SWE488 }
        credits: { type: integer, minimum: 0, maximum: 30, example: 6 }
        term: { type: string, minLength: 1, maxLength: 30, example: Fall 2026 }

    Course:
      allOf:
        - $ref: '#/components/schemas/CourseInput'
        - type: object
          properties:
            id: { type: integer }
            userId: { type: integer }
            createdAt: { type: string, format: date-time }

    ExamInput:
      type: object
      required: [title, type, date, weight]
      properties:
        title: { type: string, minLength: 1, maxLength: 100, example: Midterm }
        type: { type: string, enum: [exam, quiz, assignment, project] }
        date: { type: string, format: date-time }
        weight: { type: number, minimum: 0, maximum: 100, example: 30 }
        grade:
          type: number
          minimum: 0
          maximum: 100
          nullable: true
          description: Empty or missing means the exam is not graded yet.

    Exam:
      allOf:
        - $ref: '#/components/schemas/ExamInput'
        - type: object
          properties:
            id: { type: integer }
            courseId: { type: integer }

    CourseRef:
      type: object
      properties:
        id: { type: integer }
        code: { type: string, example: CS201 }
        name: { type: string, example: Algorithms }

    ExamWithCourse:
      allOf:
        - $ref: '#/components/schemas/Exam'
        - type: object
          properties:
            course: { $ref: '#/components/schemas/CourseRef' }

    Deadline:
      allOf:
        - $ref: '#/components/schemas/ExamWithCourse'
        - type: object
          properties:
            daysLeft:
              type: integer
              description: 0 = today, negative = days ago
              example: 3

    Deadlines:
      type: object
      properties:
        days: { type: integer, example: 14 }
        overdue:
          type: array
          items: { $ref: '#/components/schemas/Deadline' }
        upcoming:
          type: array
          items: { $ref: '#/components/schemas/Deadline' }

    CourseGrade:
      type: object
      properties:
        id: { type: integer }
        code: { type: string, example: CS201 }
        name: { type: string, example: Algorithms }
        credits: { type: integer, example: 4 }
        average: { type: number, nullable: true, example: 68 }
        letter: { type: string, nullable: true, example: DC }
        points: { type: number, nullable: true, example: 1.5 }
        gradedWeight:
          type: number
          description: Total weight of the graded exams, in percent
          example: 100

    GradesSummary:
      type: object
      properties:
        gpa: { type: number, nullable: true, example: 3.1 }
        courses:
          type: array
          items: { $ref: '#/components/schemas/CourseGrade' }
