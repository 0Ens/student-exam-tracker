openapi: 3.0.3
info:
  title: Student Exam & Course Tracker API
  version: 0.1.0
  description: REST API used by the React frontend. All endpoints except health, register and login need a Bearer token.
servers:
  - url: http://localhost:4000/api
    description: Local development

tags:
  - name: Health
  - name: Auth
  - name: Courses
  - name: Exams

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check used after deployment
      security: []
      responses:
        '200':
          description: API is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }

  /auth/register:
    post:
      tags: [Auth]
      summary: Create an account (FR1)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterInput' }
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409':
          description: E-mail already registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in and receive a JWT (FR1)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginInput' }
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401':
          description: Wrong e-mail or password
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/me:
    get:
      tags: [Auth]
      summary: Current user
      responses:
        '200':
          description: The logged in user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /courses:
    get:
      tags: [Courses]
      summary: List my courses (FR2, FR7)
      responses:
        '200':
          description: Courses of the logged in user
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Course' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Courses]
      summary: Add a course (FR2)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CourseInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Course' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /courses/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Courses]
      summary: Get one of my courses
      responses:
        '200':
          description: The course
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Course' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Courses]
      summary: Update a course
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CourseInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Course' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Courses]
      summary: Delete a course and its exams
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /courses/{id}/exams:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Exams]
      summary: List exams of a course (FR3, planned for S3)
      responses:
        '200':
          description: Exams
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Exam' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Exams]
      summary: Add an exam or assignment (FR3, planned for S3)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExamInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Exam' }
        '400': { $ref: '#/components/responses/ValidationError' }

  /exams/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [Exams]
      summary: Update an exam (FR3, planned for S3)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExamInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Exam' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Exams]
      summary: Delete an exam (FR3, planned for S3)
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer }

  responses:
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Not found or owned by another user
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Invalid input
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
        details:
          type: object
          additionalProperties:
            type: array
            items: { type: string }

    User:
      type: object
      properties:
        id: { type: integer }
        email: { type: string, format: email }
        name: { type: string }

    RegisterInput:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }

    AuthResponse:
      type: object
      properties:
        token: { type: string }
        user: { $ref: '#/components/schemas/User' }

    CourseInput:
      type: object
      required: [name, code, credits, term]
      properties:
        name: { type: string, minLength: 1, maxLength: 100, example: Software Testing }
        code: { type: string, minLength: 1, maxLength: 20, example: SWE488 }
        credits: { type: integer, minimum: 0, maximum: 30, example: 6 }
        term: { type: string, minLength: 1, maxLength: 30, example: Fall 2026 }

    Course:
      allOf:
        - $ref: '#/components/schemas/CourseInput'
        - type: object
          properties:
            id: { type: integer }
            userId: { type: integer }
            createdAt: { type: string, format: date-time }

    ExamInput:
      type: object
      required: [title, type, date, weight]
      properties:
        title: { type: string, example: Midterm }
        type: { type: string, enum: [exam, quiz, assignment, project] }
        date: { type: string, format: date-time }
        weight: { type: number, minimum: 0, maximum: 100, example: 30 }
        grade: { type: number, minimum: 0, maximum: 100, nullable: true }

    Exam:
      allOf:
        - $ref: '#/components/schemas/ExamInput'
        - type: object
          properties:
            id: { type: integer }
            courseId: { type: integer }
